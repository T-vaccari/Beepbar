name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test

  release-artifact:
    name: Release DMG
    runs-on: macos-15
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 Release app
        run: xcodebuild -project Beepbar.xcodeproj -target Beepbar -configuration Release build CODE_SIGNING_ALLOWED=NO
      - name: Verify app
        run: |
          file build/Release/Beepbar.app/Contents/MacOS/Beepbar | grep -q 'arm64'
          codesign --force --sign - --identifier io.github.tvaccari.beepbar build/Release/Beepbar.app
          codesign --verify --deep --strict --verbose=2 build/Release/Beepbar.app
      - name: Create DMG
        run: scripts/create-dmg.sh build/Release/Beepbar.app build/Beepbar.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Beepbar-dmg
          path: build/Beepbar.dmg
          if-no-files-found: error
      - name: Move latest tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically updated on every push to main. Reflects commit ${{ github.sha }}.
          prerelease: true
          make_latest: true
          files: build/Beepbar.dmg
